<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">The Mercury 3 verification stack</title>
<desc id="ddesc">Four stacked evidence layers for Inception's Mercury 3 launch: the headline claim (Inception's blog and press release), Inception's own benchmark table (eight wins of twelve at medium effort, no harness details, with Artificial Analysis flagging two labels as not comparable), independent checks (Artificial Analysis had published no measurement as of October 20; OpenRouter's live median was about 243 tokens per second; a community harness found real speed in short tasks and agent loops but competitive, not frontier, quality), and your own measurement (run your task on your data; a free 100-million-token trial is available). A footer notes the headline is a vendor best case and promo prices have no published end date.</desc>
