<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">Two paths called AI cloning</title>
<desc id="ddesc">Two horizontal lanes. The build lane runs from a shared build through code and assets, decompilation or copying, to a competing release; its note says this is documented on released games and a demo, the AI role is unproven, and no pre-release build-clone case was found. The clip lane runs from a clip or trailer through a visible mechanic, reimplementation, to a lookalike release; its note says this is documented before release, AI use is self-reported, and the commercial effect is unmeasured. A footer says the documented pre-release copy came from the clip, not the build.</desc>
<rect x="1" y="1" width="798" height="698" rx="18" fill="#f6f1e6" stroke="#cfc3ab" stroke-width="2"/>
<text x="36" y="52" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#2b2620">Two paths called AI cloning</text>
<text x="36" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-style="italic" fill="#6b6357">A build and a broadcast expose different things.</text>
<rect x="36" y="118" width="7" height="18" rx="3.5" fill="#7a5a3a"/>
<text x="52" y="133" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7a5a3a">BUILD</text>
<text x="108" y="133" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">a playable build or demo</text>
<rect x="36" y="146" width="172" height="72" rx="10" fill="#efe7d7" stroke="#cfc3ab" stroke-width="1.6"/>
<text x="122.0" y="190" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Build shared</text>
<rect x="224" y="146" width="172" height="72" rx="10" fill="#f1eadc" stroke="#cfc3ab" stroke-width="1.6"/>
<text x="310.0" y="190" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Code and assets</text>
<rect x="412" y="146" width="172" height="72" rx="10" fill="#efe7d7" stroke="#cfc3ab" stroke-width="1.6"/>
<text x="498.0" y="190" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Decompile or copy</text>
<rect x="600" y="146" width="172" height="72" rx="10" fill="#f1eadc" stroke="#cfc3ab" stroke-width="1.6"/>
<text x="686.0" y="190" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Competing release</text>
<line x1="210" y1="182.0" x2="218" y2="182.0" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 218 182.0 l -7 -4 l 0 8 z" fill="#7a5a3a"/>
<line x1="398" y1="182.0" x2="406" y2="182.0" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 406 182.0 l -7 -4 l 0 8 z" fill="#7a5a3a"/>
<line x1="586" y1="182.0" x2="594" y2="182.0" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 594 182.0 l -7 -4 l 0 8 z" fill="#7a5a3a"/>
<text x="36" y="236" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#b5542e">ReVamp moved this test to Discord</text>
<text x="36" y="252" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6b6357">EVIDENCE</text>
<text x="104" y="252" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#2b2620">Documented on released games and a demo · AI role unproven · No pre-release build case found</text>
<line x1="36" y1="296" x2="764" y2="296" stroke="#cfc3ab" stroke-width="1.3" stroke-dasharray="5 6"/>
<rect x="36" y="325" width="7" height="18" rx="3.5" fill="#b5542e"/>
<text x="52" y="340" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#b5542e">CLIP</text>
<text x="108" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">a trailer or gameplay video</text>
<rect x="36" y="354" width="172" height="72" rx="10" fill="#f3e2d8" stroke="#b5542e" stroke-width="1.4"/>
<text x="122.0" y="398" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Clip or trailer</text>
<rect x="224" y="354" width="172" height="72" rx="10" fill="#f5e7df" stroke="#b5542e" stroke-width="1.4"/>
<text x="310.0" y="398" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Visible mechanic</text>
<rect x="412" y="354" width="172" height="72" rx="10" fill="#f3e2d8" stroke="#b5542e" stroke-width="1.4"/>
<text x="498.0" y="398" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Reimplement</text>
<rect x="600" y="354" width="172" height="72" rx="10" fill="#f5e7df" stroke="#b5542e" stroke-width="1.4"/>
<text x="686.0" y="398" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#2b2620">Lookalike release</text>
<line x1="210" y1="390.0" x2="218" y2="390.0" stroke="#b5542e" stroke-width="2"/>
<path d="M 218 390.0 l -7 -4 l 0 8 z" fill="#b5542e"/>
<line x1="398" y1="390.0" x2="406" y2="390.0" stroke="#b5542e" stroke-width="2"/>
<path d="M 406 390.0 l -7 -4 l 0 8 z" fill="#b5542e"/>
<line x1="586" y1="390.0" x2="594" y2="390.0" stroke="#b5542e" stroke-width="2"/>
<path d="M 594 390.0 l -7 -4 l 0 8 z" fill="#b5542e"/>
<text x="36" y="460" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6b6357">EVIDENCE</text>
<text x="104" y="460" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#2b2620">Documented before release · AI use self-reported · Commercial effect unmeasured</text>
<rect x="32" y="510" width="736" height="64" rx="10" fill="#f3d9cc" stroke="#b5542e" stroke-width="2"/>
<text x="400.0" y="548" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#7a3216">The documented pre-release copy came from the clip, not the build.</text>
<text x="36" y="610" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#6b6357">ReVamp’s smaller test closes the first lane, not the second.</text>
