<text x="84" y="572" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#7a3216">The API ships the top half of this picture.</text>
<text x="84" y="594" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#7a3216">The threshold, the queue, and the drift check are yours.</text>
