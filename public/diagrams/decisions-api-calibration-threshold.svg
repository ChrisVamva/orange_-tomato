<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 636" width="800" height="636" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">What the number does not decide</title>
<desc id="ddesc">Two stacked zones divided by a horizontal boundary. In the upper zone, the API's side, a question, a set of allowed answers and context feed a decision endpoint, which returns a choice with a confidence. The boundary is labelled 'the estimate ends here'. In the lower zone, your side, labeled examples feed your threshold, which splits into an automated route and a review queue. A footer says the API ships the top half of the picture, while the threshold, the queue and the drift check are yours.</desc>
<rect x="1" y="1" width="798" height="634" rx="18" fill="#f6f1e6" stroke="#cfc3ab" stroke-width="2"/>
<text x="36" y="52" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#2b2620">What the number does not decide</text>
<text x="36" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" font-style="italic" fill="#6b6357">A confidence value is an estimate. Turning it into a decision is a separate job.</text>
<rect x="30" y="100" width="740" height="182" rx="12" fill="#efe7d7" stroke="#cfc3ab" stroke-width="1.3"/>
<rect x="48" y="114" width="7" height="18" rx="3" fill="#7a5a3a" stroke="#7a5a3a" stroke-width="1"/>
<text x="64" y="129" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7a5a3a">THE API'S SIDE</text>
<text x="196" y="129" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">what you buy</text>
<rect x="155" y="148" width="150" height="50" rx="9" fill="#f6f1e6" stroke="#cfc3ab" stroke-width="1.5"/>
<text x="230" y="178" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2b2620">Question</text>
<rect x="325" y="148" width="150" height="50" rx="9" fill="#f6f1e6" stroke="#cfc3ab" stroke-width="1.5"/>
<text x="400" y="178" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2b2620">Allowed answers</text>
<rect x="495" y="148" width="150" height="50" rx="9" fill="#f6f1e6" stroke="#cfc3ab" stroke-width="1.5"/>
<text x="570" y="178" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2b2620">Context</text>
<rect x="270" y="220" width="260" height="50" rx="9" fill="#efe7d7" stroke="#7a5a3a" stroke-width="1.8"/>
<text x="400" y="241" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2b2620">Decision endpoint</text>
<text x="400" y="259" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#6b6357">returns a choice + a confidence</text>
<line x1="230" y1="198" x2="322.2" y2="218.3" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 330.0 220.0 L 321.2 222.1 L 322.9 214.4 Z" fill="#7a5a3a"/>
<line x1="400" y1="198" x2="400.0" y2="212.0" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 400.0 220.0 L 396.1 211.9 L 403.9 211.9 Z" fill="#7a5a3a"/>
<line x1="570" y1="198" x2="477.8" y2="218.3" stroke="#7a5a3a" stroke-width="2"/>
<path d="M 470.0 220.0 L 477.1 214.4 L 478.8 222.1 Z" fill="#7a5a3a"/>
<line x1="36" y1="300" x2="764" y2="300" stroke="#b5542e" stroke-width="1.6" stroke-dasharray="7 7"/>
<text x="36" y="295" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-style="italic" fill="#b5542e">the estimate ends here</text>
<rect x="30" y="320" width="740" height="200" rx="12" fill="#f1eadc" stroke="#cfc3ab" stroke-width="1.3"/>
<rect x="48" y="334" width="7" height="18" rx="3" fill="#b5542e" stroke="#b5542e" stroke-width="1"/>
<text x="64" y="349" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#b5542e">YOUR SIDE</text>
<text x="156" y="349" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">what does not ship</text>
<rect x="60" y="376" width="170" height="64" rx="9" fill="#f5e7df" stroke="#b5542e" stroke-width="1.5"/>
<text x="145" y="404" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2b2620">Labeled examples</text>
<text x="145" y="423" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">from your own traffic</text>
<rect x="310" y="376" width="180" height="64" rx="9" fill="#f3d9cc" stroke="#b5542e" stroke-width="2.2"/>
<text x="400" y="404" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#2b2620">Your threshold</text>
<text x="400" y="423" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">priced against both errors</text>
<rect x="570" y="348" width="180" height="56" rx="9" fill="#f5e7df" stroke="#b5542e" stroke-width="1.5"/>
<text x="660" y="373" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2b2620">Automated route</text>
<text x="660" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">the confident cases</text>
<rect x="570" y="432" width="180" height="56" rx="9" fill="#f5e7df" stroke="#b5542e" stroke-width="1.5"/>
<text x="660" y="457" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#2b2620">Review queue</text>
<text x="660" y="474" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b6357">the rest, with a person</text>
<line x1="230" y1="408" x2="302.0" y2="408.0" stroke="#b5542e" stroke-width="2"/>
